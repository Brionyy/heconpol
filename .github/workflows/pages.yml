# 공개 저장소에 올라가면 표 · 글을 고칠 때마다 사이트를 다시 만들어 GitHub Pages 에 올린다.
# 아직 저장소가 없으므로 돌지 않는다. 교수님 승인 · 연구실 계정이 생긴 뒤 저장소 설정에서 Pages 출처를 'GitHub Actions'로 고른다.
name: 사이트 만들기와 공개

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 회원이 '내 정보'에서 적은 CV 주소를 구성원 화면에 붙이려고 하루 한 번(한국 시간 아침 6시) 다시 만든다
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # 지킴이가 지난번 공개된 판을 찾는다

concurrency:
  group: pages
  cancel-in-progress: true

# 남의 부품은 고유 번호(커밋)로 고정한다(2026-11-02 보안 검토). 판을 올릴 때는 새 판의 번호로 바꾸고 뒤 주석의 판도 고친다.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # 지킴이가 이번에 올라온 판들을 하나씩 본다
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # 관리 화면 도우미(GitHub App)가 만든 판은 표 다섯 개 · 사진 폴더만 고칠 수 있다. 그 밖을 건드렸으면 공개를 멈춘다(2026-10-28).
      # 정기 실행 · 손으로 돌릴 때도 '지난번 공개된 판 뒤의 모든 판'을 보고, 허락 목록 · 지킴이는 지난번 공개된 판에서 읽는다(검토 10-28 1번)
      - name: 관리 화면 판 지킴이
        env:
          ADMIN_BOT: ${{ vars.ADMIN_BOT || 'heconpol-admin[bot]' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --workflow pages.yml --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          [ -n "$base" ] || base=$(git rev-list --max-parents=0 HEAD | tail -1)
          git show "$base:tools/check_admin_commit.py" > "$RUNNER_TEMP/guard.py" 2>/dev/null || cp tools/check_admin_commit.py "$RUNNER_TEMP/guard.py"
          python3 "$RUNNER_TEMP/guard.py" --root . --rules-ref "$base" "$base" "${{ github.sha }}"
      - name: 만들기 시험
        run: python3 -m unittest discover -s tests
      - name: 사이트 만들기(회원이 적은 CV 주소를 공개 열쇠로 받아 붙임, 서버가 없으면 건너뜀)
        run: python3 build.py --fetch-cv
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
