# 공개 저장소에 올라가면 표 · 글을 고칠 때마다 사이트를 다시 만들어 GitHub Pages 에 올린다.
# 아직 저장소가 없으므로 돌지 않는다. 교수님 승인 · 연구실 계정이 생긴 뒤 저장소 설정에서 Pages 출처를 'GitHub Actions'로 고른다.
name: 사이트 만들기와 공개

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 회원이 '내 정보'에서 적은 CV 주소를 구성원 화면에 붙이려고 하루 한 번(한국 시간 아침 6시) 다시 만든다
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 만들기 시험
        run: python3 -m unittest discover -s tests
      - name: 사이트 만들기(회원이 적은 CV 주소를 공개 열쇠로 받아 붙임, 서버가 없으면 건너뜀)
        run: python3 build.py --fetch-cv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
