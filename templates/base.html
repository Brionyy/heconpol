<!doctype html>
<html lang="{{ lang }}"{{ palette_attr }}>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{ csp }}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
{{ head_extra }}
<link rel="icon" href="{{ favicon }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ fonts }}">
<link rel="stylesheet" href="{{ css }}">{{ palette_css }}
<noscript><link rel="stylesheet" href="{{ nojs_css }}"></noscript>
{{ data_block }}
{{ scripts }}
</head>
<body class="{{ body_class }}">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="{{ header_class }}">
  <div class="hdr-in">
    <a class="brand" href="{{ home }}">
      <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true"><rect x="1" y="1" width="46" height="46" fill="none" stroke="#c9a45c" stroke-width="1.4"/><path d="M12 36 V16 L24 10 L36 16 V36" fill="none" stroke="#c9a45c" stroke-width="1.8" stroke-linejoin="miter"/><path d="M18 36 V22 H30 V36" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="36" x2="40" y2="36" stroke="#c9a45c" stroke-width="1.4"/></svg>
      <span><b>{{ brand_name }}</b><small>{{ brand_en }}</small></span>
    </a>
    <button type="button" class="menu-btn" aria-expanded="false" aria-controls="nav-list"><span class="menu-ico" aria-hidden="true"></span><span class="menu-txt">메뉴</span></button>
    <nav aria-label="주 메뉴"><ul id="nav-list" class="nav-list">{{ nav }}</ul></nav>
  </div>
</header>
<main id="main" class="{{ main_class }}">
{{ band }}
{{ body }}
</main>
<div class="aff">
  <img src="{{ aff_ko }}" alt="서울대학교 보건대학원" width="136" height="38">
  <img src="{{ aff_snu }}" alt="서울대학교" width="165" height="38">
  {{ orgs }}
</div>
<footer class="foot">
  <div class="foot-in">
    <span>{{ foot_name }}</span>
    <span>{{ foot_addr }} {{ foot_mail }}</span>
    <span class="foot-links">{{ foot_links }}</span>
  </div>
</footer>
</body>
</html>
